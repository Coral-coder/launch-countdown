# Runs hourly, when the site changes, or by hand. Launch time and status also update live in each viewer's browser.
name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"   # hourly, off the top of the hour where GitHub's scheduler is busiest
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - id: pages
        uses: actions/configure-pages@v5
      - name: Fetch launch data
        # On total failure the committed data/launches.json is deployed unchanged.
        run: |
          python3 scripts/fetch_launches.py \
            --previous "${{ steps.pages.outputs.base_url }}/data/cache.json" \
            --out data/launches.json || echo "::warning::launch data refresh failed; deploying the committed copy"
      - name: Snapshot aircraft, vessels and hazard areas
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
        run: |
          if [ -n "$AISSTREAM_API_KEY" ]; then pip install -q websockets; fi
          python3 scripts/fetch_traffic.py || echo "::warning::traffic snapshot failed"
      - name: Stamp the build
        run: echo "{\"sha\":\"$GITHUB_SHA\"}" > version.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
