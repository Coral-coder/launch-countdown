name: Update launch data and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/10 * * * *"   # GitHub runs scheduled jobs on a best-effort basis; expect 10-20 minute spacing
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - id: pages
        uses: actions/configure-pages@v5
      - name: Fetch launch data
        # On total failure the committed data/launches.json is deployed unchanged.
        run: |
          python3 scripts/fetch_launches.py \
            --previous "${{ steps.pages.outputs.base_url }}/data/launches.json" \
            --out data/launches.json || echo "::warning::launch data refresh failed; deploying the committed copy"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
