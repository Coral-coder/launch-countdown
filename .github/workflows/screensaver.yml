name: Build Windows screensaver

# Manual only: run it from the Actions tab (or ask for a build) when a new screensaver should ship.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: dotnet build screensaver/LaunchCountdown.csproj -c Release -o out
      - name: Package
        shell: pwsh
        run: |
          # the same program under two names: .scr is the screensaver, .exe opens the windowed app
          Copy-Item out/LaunchCountdown.exe out/LaunchCountdown.scr
          if (Test-Path out/LaunchCountdown.exe.config) { Copy-Item out/LaunchCountdown.exe.config out/LaunchCountdown.scr.config }
          Remove-Item out/*.pdb, out/*.xml -ErrorAction SilentlyContinue
          Copy-Item screensaver/INSTALL.txt out/
          # the build's identity: the program compares this with the release to update itself
          Set-Content -Path out/version.txt -Value $env:GITHUB_SHA -NoNewline
          Copy-Item out/version.txt version.txt
          Get-ChildItem out -Recurse | Select-Object FullName, Length
          Compress-Archive -Path out/* -DestinationPath LaunchCountdownScreensaver.zip
      - uses: actions/upload-artifact@v4
        with:
          name: LaunchCountdownScreensaver
          path: LaunchCountdownScreensaver.zip
      - name: Publish to the "screensaver" release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view screensaver 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create screensaver --title "Windows screensaver" --notes "Latest build of the Launch Countdown screensaver. Extract the zip, then right-click LaunchCountdown.scr and choose Install. See INSTALL.txt inside."
          }
          gh release upload screensaver LaunchCountdownScreensaver.zip --clobber
          gh release upload screensaver version.txt --clobber
